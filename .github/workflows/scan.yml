# Save as .github/workflows/scan.yml
name: Scheduled scan

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write            # needed to commit data/ back
  issues: write              # health alerts (scripts/health_alert.py)

concurrency:
  group: scan
  cancel-in-progress: false  # never let two scans write state at once

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-kronos.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Kronos forecast agent: CPU-only torch (the default PyPI wheel drags in
      # ~2 GB of CUDA libraries a GitHub runner can't use). Failure here must
      # not block the scan - the agent detects missing torch and sits out.
      - name: Install Kronos dependencies
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-kronos.txt

      # Kronos-small + tokenizer weights (~100 MB) from Hugging Face, cached
      # so scans don't re-download them every 6 hours.
      - name: Cache Kronos weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-hf-${{ hashFiles('vendor/kronos/VENDORED.md') }}
          restore-keys: kronos-hf-

      - name: Run pipeline
        id: pipeline
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          SANTIMENT_API_KEY: ${{ secrets.SANTIMENT_API_KEY }}
        run: python3 run_pipeline.py --no-clear

      # Open / update / close the "health-alert" GitHub Issue from
      # data/health.json. Never fails the scan.
      - name: Health alert
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_OUTCOME: ${{ steps.pipeline.outcome }}
        run: python3 scripts/health_alert.py

      - name: Prune old reports (keep latest 30)
        run: |
          ls -1t data/reports/report_*.md 2>/dev/null | tail -n +31 | xargs -r rm -f

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # -f because data/memory and data/reports are in .gitignore
          git add -A -f data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "scan: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
