# Save as .github/workflows/scan.yml
name: Scheduled scan

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write            # needed to commit data/ back

concurrency:
  group: scan
  cancel-in-progress: false  # never let two scans write state at once

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python3 run_pipeline.py --no-clear

      - name: Prune old reports (keep latest 30)
        run: |
          ls -1t data/reports/report_*.md 2>/dev/null | tail -n +31 | xargs -r rm -f

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # -f because data/memory and data/reports are in .gitignore
          git add -A -f data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "scan: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
